<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Old address (25 Nov 2026): ticketpulse.bgcsi.com is the main address. The
         old host forwards every link (e-mails, /it/TP-…, /ticket-status/<token>,
         approval pages) to the same path there. Exactly that one host: never
         localhost or the azurestaticapps preview host. Keep this first. -->
    <script>
      (function () {
        if (location.hostname === 'ticketpulse.bgcsaas.com') {
          try {
            location.replace('https://ticketpulse.bgcsi.com' + location.pathname + location.search + location.hash);
            // Only once the move is under way: a blocked navigation lets the app start here.
            window.__tpMovingHost = true; // main.jsx then does not start the app here
          } catch (e) { /* stay on the old address */ }
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/favicon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ticket Pulse" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Theme pre-paint (Phase DM-A): main.jsx renders only after the async
         MSAL initialize(), so the stored choice ('tp_theme': system|light|dark,
         system = the OS preference) is stamped on <html> here, before the
         first paint — no white flash on a dark reload. ThemeContext keeps it
         in sync afterwards. Keep this before /src/main.jsx. -->
    <style>html.dark { background: #090e1a; color-scheme: dark; }</style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tp_theme');
          var dark = t === 'dark' || (t !== 'light' && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
          if (dark) {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#090e1a');
          }
        } catch (e) { /* storage blocked: light default */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ticket Pulse - FreshService Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
