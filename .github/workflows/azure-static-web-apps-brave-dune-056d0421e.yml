name: Azure Static Web Apps CI/CD

# Production deploys only (push to main). PR preview deploys are disabled:
# this repo's release flow opens a PR and merges it within a minute, and each
# release pushes the branch twice (feature commit + trunk merge-back), so the
# two preview builds raced each other into "content server rejected the
# request: BadRequest" failures on every release — red X noise for an
# environment nobody ever opened. They also burned SWA staging-environment
# slots (the per-app cap has bitten before).
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_DUNE_056D0421E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          api_location: ""
          output_location: "dist"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FRESHSERVICE_DOMAIN: ${{ secrets.VITE_FRESHSERVICE_DOMAIN }}
          VITE_AZURE_AD_CLIENT_ID: ${{ secrets.VITE_AZURE_AD_CLIENT_ID }}
          VITE_AZURE_AD_TENANT_ID: ${{ secrets.VITE_AZURE_AD_TENANT_ID }}
